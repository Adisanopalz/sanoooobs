<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Interaktif YT Shorts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Pengaturan Dasar untuk OBS */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            /* Background transparan untuk OBS, tapi diberi opsi background gelap untuk testing */
            background-color: transparent;
            color: white;
            transition: background-color 0.3s ease;
        }

        /* Class untuk mode testing di browser biasa */
        body.test-mode {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            background-size: cover;
        }

        /* Glassmorphism Effect */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Layout Utama Vertikal */
        .overlay-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            box-sizing: border-box;
        }

        /* Animations */
        @keyframes slideInLeft {
            from { transform: translateX(-120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOutLeft {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(-120%); opacity: 0; }
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5) rotate(20deg); opacity: 0; }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
            50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.9); }
            100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        }

        /* Hapus alert-box, ganti dengan animasi heart beat */
        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }

        .heart-beat {
            animation: heartBeat 2s infinite;
        }

        .emoji-particle {
            position: absolute;
            bottom: -50px;
            font-size: 2rem;
            pointer-events: none;
            z-index: -1;
            animation: floatUp linear forwards;
        }

        /* Target Bar */
        .progress-bar-fill {
            transition: width 0.5s ease-out;
        }

        /* Tombol Test (Sembunyikan saat di OBS) */
        #test-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            opacity: 0.2;
            transition: opacity 0.3s;
        }
        #test-controls:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Tombol untuk Testing (Jangan khawatir, ini bisa disembunyikan/transparan di OBS) -->
    <div id="test-controls" class="glass p-2 rounded-lg text-xs flex gap-2">
        <button onclick="toggleTestMode()" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded">Toggle BG</button>
        <button onclick="simulateEvent()" class="bg-green-600 hover:bg-green-700 px-3 py-1 rounded">Test Event</button>
    </div>

    <div class="overlay-container pointer-events-none">
        
        <!-- Bagian Atas: Sub Goal & Info -->
        <div class="w-full max-w-sm mx-auto mt-10 space-y-4">
            <!-- Goal Widget -->
            <div class="glass rounded-xl p-4">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-sm tracking-wider uppercase text-yellow-300">🔥 Subscriber Goal</h2>
                    <span id="goal-text" class="text-xs font-bold bg-yellow-500/20 px-2 py-1 rounded text-yellow-300">1,250 / 2,000</span>
                </div>
                <div class="w-full bg-black/40 h-4 rounded-full overflow-hidden border border-white/10">
                    <div id="goal-bar" class="bg-gradient-to-r from-yellow-400 to-orange-500 h-full progress-bar-fill pulseGlow" style="width: 62.5%;"></div>
                </div>
            </div>
        </div>

        <!-- Bagian Tengah: Target Like (Pengganti Notifikasi) -->
        <div class="w-full flex-1 flex flex-col justify-center items-center gap-3">
            <div class="glass rounded-full px-6 py-4 flex flex-col items-center justify-center border-t-2 border-pink-500 shadow-[0_0_20px_rgba(236,72,153,0.3)]">
                <span class="text-xs font-bold text-pink-300 mb-1 uppercase tracking-widest">Target Like</span>
                <div class="flex items-center gap-3 text-3xl font-black">
                    <span class="heart-beat text-pink-500 drop-shadow-[0_0_10px_rgba(236,72,153,0.8)]">❤️</span>
                    <span id="like-counter" class="text-white drop-shadow-md">15,420</span>
                </div>
                <p class="text-[10px] text-gray-300 mt-2 bg-black/30 px-3 py-1 rounded-full">Bantu tap-tap layar ges!</p>
            </div>
        </div>

        <!-- Bagian Bawah: Top Supporter Leaderboard (Pengganti Polling) -->
        <div class="w-full max-w-sm mx-auto mb-10">
            <div class="glass rounded-2xl p-5 border-t-4 border-t-yellow-400 relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-yellow-500/20 rounded-full blur-2xl"></div>
                
                <div class="flex items-center gap-2 mb-4 relative z-10">
                    <span class="text-xl">🏆</span>
                    <h3 class="font-bold text-lg leading-tight text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600">Top Supporters</h3>
                </div>
                
                <ul id="leaderboard-list" class="space-y-3 relative z-10">
                    <!-- List Leaderboard akan di-generate via JS -->
                </ul>
            </div>
        </div>

    </div>

    <!-- Container untuk Floating Emojis -->
    <div id="emoji-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <script>
        // --- KONFIGURASI STATE ---
        let subs = 1250;
        const maxSubs = 2000;
        let likes = 15420;
        
        // State untuk Leaderboard
        let supporters = [
            { name: 'Raja_Mabar', points: 1500, role: '🥇' },
            { name: 'Siti_Pro', points: 1200, role: '🥈' },
            { name: 'BudiGaming', points: 850, role: '🥉' }
        ];
        
        const emojis = ['❤️', '🔥', '😂', '👍', '🎉', '💯', '✨'];
        const usernames = ['AsepKnalpot', 'Dewi_Mabar', 'TukangSate', 'SiPalingGG', 'CahayaIlahi', 'BocilKematian'];

        // --- FUNGSI UPDATE UI ---

        // 1. Update Sub Goal
        function updateGoal(amount) {
            subs += amount;
            if (subs > maxSubs) subs = maxSubs;
            
            const percentage = (subs / maxSubs) * 100;
            document.getElementById('goal-text').innerText = `${subs.toLocaleString()} / ${maxSubs.toLocaleString()}`;
            document.getElementById('goal-bar').style.width = `${percentage}%`;
        }

        // 2. Update Likes
        function updateLikes(amount) {
            likes += amount;
            document.getElementById('like-counter').innerText = likes.toLocaleString();
        }

        // 3. Update Leaderboard
        function updateLeaderboard(randomUser, pointsAdded) {
            if (randomUser) {
                let existingUser = supporters.find(s => s.name === randomUser);
                if (existingUser) {
                    existingUser.points += pointsAdded;
                } else {
                    supporters[2].points += pointsAdded;
                    if (Math.random() > 0.5) supporters[2].name = randomUser;
                }
                supporters.sort((a, b) => b.points - a.points);
            }
            
            const listContainer = document.getElementById('leaderboard-list');
            listContainer.innerHTML = '';
            const medals = ['🥇', '🥈', '🥉'];
            
            supporters.forEach((sup, index) => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-black/20 p-2 rounded-lg border border-white/5';
                li.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-lg drop-shadow-md">${medals[index]}</span>
                        <span class="font-semibold text-sm drop-shadow-md text-white/90">${sup.name}</span>
                    </div>
                    <div class="text-xs font-bold bg-white/10 px-2 py-1 rounded text-yellow-300">
                        ${sup.points.toLocaleString()} pts
                    </div>
                `;
                listContainer.appendChild(li);
            });
        }

        // 4. Floating Emoji
        function createEmoji(specificEmoji = null) {
            const container = document.getElementById('emoji-container');
            const emojiEl = document.createElement('div');
            
            const emoji = specificEmoji || emojis[Math.floor(Math.random() * emojis.length)];
            const leftPos = Math.random() * 90 + 5; 
            const duration = Math.random() * 2 + 3; 

            emojiEl.classList.add('emoji-particle');
            emojiEl.innerText = emoji;
            emojiEl.style.left = `${leftPos}%`;
            emojiEl.style.animationDuration = `${duration}s`;

            container.appendChild(emojiEl);

            setTimeout(() => {
                emojiEl.remove();
            }, duration * 1000);
        }

        // --- MODE SIMULASI (Untuk Preview) ---
        
        let simInterval;
        let emojiInterval;
        let likeInterval;

        function startSimulation() {
            updateLeaderboard('', 0); // Initial render

            // Simulasi Likes (Tap layar)
            likeInterval = setInterval(() => {
                updateLikes(Math.floor(Math.random() * 15) + 1);
                if(Math.random() > 0.5) createEmoji('❤️');
            }, 800);

            // Simulasi Emoji
            emojiInterval = setInterval(() => {
                if(Math.random() > 0.4) createEmoji();
            }, 500);

            // Simulasi Event (Nyawer / Sub)
            simInterval = setInterval(() => {
                const randomUser = usernames[Math.floor(Math.random() * usernames.length)];
                const eventRand = Math.random();

                if (eventRand < 0.4) {
                    updateLeaderboard(randomUser, Math.floor(Math.random() * 100) + 50);
                } else if (eventRand < 0.6) {
                    updateGoal(1);
                    for(let i=0; i<8; i++) setTimeout(() => createEmoji('🎉'), i*150);
                }
            }, 3000);
        }

        function toggleTestMode() {
            document.body.classList.toggle('test-mode');
        }

        function simulateEvent() {
            const randomUser = usernames[Math.floor(Math.random() * usernames.length)];
            updateLeaderboard(randomUser, 500);
            updateGoal(3);
            for(let i=0; i<15; i++) setTimeout(() => createEmoji('🎉'), i*50);
        }

        // Init
        startSimulation();
        document.body.classList.add('test-mode');

    </script>
</body>
</html>
