<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Stream Overlay untuk OBS</title>
    <!-- Tailwind untuk styling layout sederhana -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js untuk efek suara procedural -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Font Poppins untuk UI yang lebih modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: transparent; /* Default untuk OBS */
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.5s ease;
        }

        /* Mode Test untuk melihat di browser biasa */
        body.test-mode {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        }

        /* Glassmorphism UI */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Switch Toggle Custom */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #10B981;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #10B981;
        }

        /* Styling Partikel Emoji */
        .emoji-particle {
            position: absolute;
            bottom: -80px;
            pointer-events: none;
            z-index: 50;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
            animation-name: floatUp;
            animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            animation-fill-mode: forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 1; transform: translateY(-5vh) scale(1.2) rotate(-10deg); }
            80% { opacity: 1; transform: translateY(-80vh) scale(1) rotate(15deg); }
            100% { transform: translateY(-110vh) scale(0.8) rotate(30deg); opacity: 0; }
        }
        
        @keyframes swayLeft {
            0%, 100% { margin-left: 0; }
            50% { margin-left: -50px; }
        }
        @keyframes swayRight {
            0%, 100% { margin-left: 0; }
            50% { margin-left: 50px; }
        }

        .sway-1 { animation: floatUp var(--duration) forwards, swayLeft 3s ease-in-out infinite; }
        .sway-2 { animation: floatUp var(--duration) forwards, swayRight 4s ease-in-out infinite; }
        .sway-3 { animation: floatUp var(--duration) forwards, swayLeft 2.5s ease-in-out infinite reverse; }

        .mega-emoji {
            font-size: 6rem !important;
            z-index: 100;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
        }

        /* Transisi untuk menyembunyikan panel */
        .fade-out {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }
    </style>
</head>
<body ondblclick="showPanel()"> <!-- Double click dimana saja untuk memunculkan panel -->

    <!-- Container Utama Emoji -->
    <div id="canvas-container" class="absolute inset-0 w-full h-full pointer-events-none"></div>

    <!-- UI Dashboard Kontrol (Hanya untuk Streamer) -->
    <div id="control-panel" class="absolute inset-0 flex items-center justify-center z-[999] transition-all duration-500 ease-in-out">
        <div class="glass-panel w-[90%] max-w-sm rounded-3xl p-6 text-white relative overflow-hidden">
            
            <!-- Dekorasi background -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-pink-500/20 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-500/20 rounded-full blur-3xl"></div>

            <!-- Header -->
            <div class="text-center mb-6 relative z-10">
                <h2 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-400 to-indigo-400">
                    Overlay Interaktif
                </h2>
                <p class="text-xs text-gray-400 mt-1">Setup Dashboard untuk OBS</p>
            </div>

            <div class="space-y-5 relative z-10">
                <!-- Status Audio -->
                <div class="bg-white/5 rounded-2xl p-4 border border-white/5 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-semibold">Status Audio</p>
                        <p id="audio-status-text" class="text-xs text-red-400 flex items-center gap-1 mt-1">
                            <span class="relative flex h-2 w-2">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                            </span>
                            Belum Aktif
                        </p>
                    </div>
                    <button id="btn-audio" onclick="initAudio()" class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 px-4 py-2 rounded-xl text-sm font-semibold shadow-lg shadow-purple-500/30 transition-all active:scale-95">
                        Aktifkan
                    </button>
                </div>

                <!-- Mode Test Toggle -->
                <div class="bg-white/5 rounded-2xl p-4 border border-white/5 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-semibold">Background Mode</p>
                        <p class="text-[10px] text-gray-400 mt-1">Nyalakan saat di browser, matikan di OBS</p>
                    </div>
                    <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="bg-toggle" onchange="toggleBackground()" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-gray-600 appearance-none cursor-pointer transition-all duration-300 z-10 top-0 left-0" checked/>
                        <label for="bg-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer transition-all duration-300"></label>
                    </div>
                </div>

                <!-- Uji Coba Trigger -->
                <div>
                    <p class="text-xs font-semibold text-gray-400 mb-2 px-1 uppercase tracking-wider">Uji Coba Animasi</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="triggerLike()" class="bg-white/10 hover:bg-white/20 border border-white/10 py-2.5 rounded-xl text-sm font-medium transition-colors flex justify-center items-center gap-2">
                            <span>❤️</span> Like
                        </button>
                        <button onclick="spawnEmojiBurst(20)" class="bg-pink-500/20 hover:bg-pink-500/30 border border-pink-500/30 text-pink-300 py-2.5 rounded-xl text-sm font-medium transition-colors flex justify-center items-center gap-2">
                            <span>🎁</span> Mega Burst
                        </button>
                    </div>
                </div>

                <!-- Tombol Sembunyikan (Live Mode) -->
                <div class="pt-2">
                    <button onclick="hidePanel()" class="w-full bg-white text-gray-900 hover:bg-gray-200 py-3 rounded-xl font-bold shadow-[0_0_20px_rgba(255,255,255,0.2)] transition-all active:scale-95 flex justify-center items-center gap-2">
                        <span>👁️‍🗨️</span> Masuk Mode OBS (Sembunyikan)
                    </button>
                    <p class="text-[10px] text-center text-gray-400 mt-3 font-medium">
                        Tips: <i>Double-click</i> layar untuk memunculkan panel ini lagi.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- UI & UX LOGIC ---
        const controlPanel = document.getElementById('control-panel');
        const body = document.body;
        const audioStatusText = document.getElementById('audio-status-text');
        const btnAudio = document.getElementById('btn-audio');

        function hidePanel() {
            controlPanel.classList.add('fade-out');
        }

        function showPanel() {
            controlPanel.classList.remove('fade-out');
        }

        function toggleBackground() {
            body.classList.toggle('test-mode');
        }

        function updateAudioUI() {
            audioStatusText.innerHTML = `
                <span class="relative flex h-2 w-2">
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500 shadow-[0_0_8px_#10B981]"></span>
                </span>
                Aktif & Siap!
            `;
            audioStatusText.classList.replace('text-red-400', 'text-green-400');
            btnAudio.innerText = '✓ Selesai';
            btnAudio.classList.replace('from-indigo-500', 'from-emerald-500');
            btnAudio.classList.replace('to-purple-600', 'to-green-600');
            btnAudio.disabled = true;
        }

        // --- KONFIGURASI EMOJI ---
        const emojiSets = {
            likes: ['❤️', '💖', '💗', '💓', '💕'],
            reactions: ['😂', '🔥', '💀', '😭', '🤯', '💯', '✨', '👀'],
            gifts: ['🎁', '💎', '👑', '🚀', '⭐', '🎉'],
            faces: ['😎', '🥳', '🥺', '😡', '😱']
        };
        const allEmojis = Object.values(emojiSets).flat();

        // --- SISTEM SUARA DENGAN TONE.JS ---
        let audioInitialized = false;
        let popSynth, sparkleSynth;

        async function initAudio() {
            if (audioInitialized) return;
            
            await Tone.start();
            
            popSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();
            popSynth.volume.value = -15;

            sparkleSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.05, decay: 0.3, sustain: 0.1, release: 1 }
            }).toDestination();
            sparkleSynth.volume.value = -10;

            audioInitialized = true;
            updateAudioUI();
        }

        function playPopSound() {
            if (!audioInitialized) return;
            const notes = ["C5", "E5", "G5", "C6"];
            const randomNote = notes[Math.floor(Math.random() * notes.length)];
            popSynth.triggerAttackRelease(randomNote, "32n");
        }

        function playSparkleSound() {
            if (!audioInitialized) return;
            const now = Tone.now();
            sparkleSynth.triggerAttackRelease("C5", "16n", now);
            sparkleSynth.triggerAttackRelease("E5", "16n", now + 0.1);
            sparkleSynth.triggerAttackRelease("G5", "16n", now + 0.2);
            sparkleSynth.triggerAttackRelease("C6", "8n", now + 0.3);
        }

        // --- SISTEM PEMBUATAN EMOJI ---
        const container = document.getElementById('canvas-container');

        function createEmoji(options = {}) {
            const el = document.createElement('div');
            
            const emojiChar = options.char || allEmojis[Math.floor(Math.random() * allEmojis.length)];
            const size = options.size || (Math.random() * 1.5 + 1.5); 
            const leftPos = options.left !== undefined ? options.left : (Math.random() * 90 + 5); 
            const duration = options.duration || (Math.random() * 3 + 3); 
            
            const swayClass = `sway-${Math.floor(Math.random() * 3) + 1}`;

            el.innerText = emojiChar;
            el.className = `emoji-particle ${swayClass}`;
            if(options.isMega) el.classList.add('mega-emoji');

            el.style.left = `${leftPos}%`;
            el.style.fontSize = `${size}rem`;
            el.style.setProperty('--duration', `${duration}s`);
            
            const startRotation = Math.random() * 60 - 30;
            el.style.transform = `rotate(${startRotation}deg)`;

            container.appendChild(el);

            setTimeout(() => {
                if (el.parentNode === container) container.removeChild(el);
            }, duration * 1000);
        }

        // --- FUNGSI TRIGGER UNTUK EVENT ---
        function triggerLike() {
            const char = emojiSets.likes[Math.floor(Math.random() * emojiSets.likes.length)];
            createEmoji({ char: char });
            if(Math.random() > 0.5) playPopSound(); 
        }

        function spawnEmojiBurst(count = 10, specialChar = null) {
            playSparkleSound();
            
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const isMega = (i === Math.floor(count / 2)); 
                    const leftPos = 20 + Math.random() * 60; 
                    
                    let char = specialChar;
                    if(!char) {
                        const set = count > 10 ? emojiSets.gifts : emojiSets.reactions;
                        char = set[Math.floor(Math.random() * set.length)];
                    }

                    createEmoji({
                        char: char,
                        isMega: isMega,
                        left: leftPos,
                        duration: Math.random() * 2 + 2.5 
                    });
                    
                    playPopSound();
                    
                }, i * 100); 
            }
        }

        // --- SIMULASI OTOMATIS (Untuk Preview) ---
        function startSimulation() {
            setInterval(() => {
                const amount = Math.floor(Math.random() * 3);
                for(let i=0; i<amount; i++) setTimeout(triggerLike, i * 200);
            }, 1000);

            setInterval(() => {
                if(Math.random() > 0.8) spawnEmojiBurst(Math.floor(Math.random() * 8) + 4);
            }, 6000);
        }

        // INIT
        document.body.classList.add('test-mode');
        startSimulation();

    </script>
</body>
</html>
